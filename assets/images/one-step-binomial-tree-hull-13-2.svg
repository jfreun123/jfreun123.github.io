<?xml version="1.0" encoding="utf-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" font-family="'Times New Roman', Times, serif" font-size="24" fill="#000000">
  <rect width="600" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <!-- branches: root (100,180) to up (450,50) and down (450,310), trimmed so the arrowheads stop at the node edges -->
  <line x1="107.5" y1="177.2" x2="443.4" y2="52.4" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="107.5" y1="182.8" x2="443.4" y2="307.6" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- nodes -->
  <circle cx="100" cy="180" r="5"/>
  <circle cx="450" cy="50" r="5"/>
  <circle cx="450" cy="310" r="5"/>
  <!-- root labels -->
  <text x="64" y="173"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="6">0</tspan></text>
  <text x="66" y="202" font-style="italic">f</text>
  <!-- up labels -->
  <text x="465" y="47"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="6">0</tspan><tspan dy="-6" font-style="italic">u</tspan></text>
  <text x="465" y="76" font-style="italic">f<tspan font-size="16" dy="6">u</tspan></text>
  <!-- down labels -->
  <text x="465" y="307"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="6">0</tspan><tspan dy="-6" font-style="italic">d</tspan></text>
  <text x="465" y="336" font-style="italic">f<tspan font-size="16" dy="6">d</tspan></text>
</svg>
